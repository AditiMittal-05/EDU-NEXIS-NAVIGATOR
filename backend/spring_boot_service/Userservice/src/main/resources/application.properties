spring.application.name=Userservice

server.port=${SERVER_PORT:8080}

# Database credentials & connection (externalized with local dev fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userservice_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Hibernate DDL & SQL logging
# Note: Use 'validate' or 'none' with Flyway/Liquibase migration in production
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# JWT configuration
jwt.secret=${JWT_SECRET:your-default-secret-key-that-is-at-least-256-bits-long-for-dev-only}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
